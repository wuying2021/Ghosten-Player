name: ghosten_player
description: "Ghosten Player: A Video Player"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.0
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  animations: ^2.2.0
  api:
    git:
      url: https://github.com/GhostenEditor/Ghosten-Player-flutter-packages.git
      path: api
      ref: v0.0.9
  bluetooth:
    git:
      url: https://github.com/GhostenEditor/Ghosten-Player-flutter-packages.git
      path: bluetooth
      ref: v0.0.9
  cached_network_image: ^3.4.1
  collection: ^1.19.0
  date_format: ^2.0.0
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  file_picker:
    git:
      url: https://github.com/GhostenEditor/Ghosten-Player-flutter-packages.git
      path: file_picker
      ref: v0.0.9
  file_selector: ^1.1.0
  flutter_archive: ^6.3.1
  flutter_colorpicker: ^1.1.0
  flutter_slidable: ^4.0.3
  flutter_spinkit: ^5.2.2
  flutter_widget_from_html_core: ^0.15.2
  html: ^0.15.7
  infinite_scroll_pagination: ^5.1.1
  install_plugin: ^2.1.0
  logger:
    git:
      url: https://github.com/GhostenEditor/Ghosten-Player-flutter-packages.git
      path: logger
      ref: v0.0.9
  markdown: ^7.3.1
  markdown_widget:
    git:
      url: https://github.com/GhostenEditor/markdown_widget.git
      ref: master
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  readmore: ^3.0.0
  rxdart: ^0.28.0
  scaled_app: ^2.3.2
  screen_brightness: ^2.1.11
  scroll_to_index: ^3.0.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  url_launcher: ^6.3.2
  vector_math: ^2.4.3
  video_player:
    git:
      url: https://github.com/GhostenEditor/Ghosten-Player-flutter-packages.git
      path: video_player
      ref: v0.0.9
  volume_controller: ^3.4.1
  webview_cookie_manager_plus: ^2.0.17
  webview_flutter: ^4.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto Condensed
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
